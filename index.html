        // 計算文字重疊匹配分數（文字相似度算法）
        function calculateScore(target, spoken) {
            if (!target || !spoken) return 0;
            const targetChars = [...target.replace(/[^\u4e00-\u9fa5a-zA-Z0-9]/g, '')];
            const spokenChars = [...spoken.replace(/[^\u4e00-\u9fa5a-zA-Z0-9]/g, '')];
            
            if (targetChars.length === 0) return 100;

            let match = 0;
            targetChars.forEach(ch => {
                if (spokenChars.includes(ch)) {
                    match++;
                }
            });

            const rawScore = Math.round((match / targetChars.length) * 100);
            return Math.min(100, Math.max(0, rawScore));
        }

            if (data.cover) {
                document.getElementById('cover-img-container').innerHTML = `<img src="${data.cover}">`;
            }

            // 2. 同步各課程圖片快取
            window.coursesData.forEach(c => {
                if (data[`course_${c.id}`]) {
                    c.imageUrl = data[`course_${c.id}`];
                }
            });

            // 3. 詳情頁即時連動
            if (window.currentActiveCourse && data[`course_${window.currentActiveCourse.id}`]) {
                const currentUrl = data[`course_${window.currentActiveCourse.id}`];
                window.currentActiveCourse.imageUrl = currentUrl;
                document.getElementById('detail-img-container').innerHTML = `<img src="${currentUrl}">`;
            }

            // 4. 即時修復：若當前正在課程牆（list-screen），自動重新 render 課程卡片以同步圖片
            const listScreen = document.getElementById('list-screen');
            if (listScreen && listScreen.classList.contains('active')) {
                window.filterAndNavigate(window.currentCategoryId || '1');
            }
        });

        // 上傳至 Storage 並將圖片 URL 儲存至 Database
        document.getElementById('image-file-picker').addEventListener('change', async function(event) {
            const file = event.target.files[0];
            if (!file) return;

            if (file.size > 5000000) {
                alert("圖片檔案太大，請選擇 5MB 以下的照片！");
                this.value = "";
                return;
            }

            const loading = document.getElementById('loadingOverlay');
            loading.classList.add('active');

            try {
                const storageReference = storageRef(storage, `lohas_photos/${Date.now()}_${file.name}`);
                const snapshot = await uploadBytes(storageReference, file);
                const downloadURL = await getDownloadURL(snapshot.ref);

                if (window.uploadTargetMode === "cover") {
                    await set(dbRef(database, 'lohas_images/cover'), downloadURL);
                } else if (window.uploadTargetMode === "detail" && window.currentActiveCourse) {
                    await set(dbRef(database, `lohas_images/course_${window.currentActiveCourse.id}`), downloadURL);
                }
            } catch (err) {
                console.error("Firebase Storage/Database 出錯:", err);
                alert("上傳失敗，請檢查 Realtime Database 權限或網路連線！");
            } finally {
                loading.classList.remove('active');
                event.target.value = "";
            }
        });

        // Web Speech API 原生粵語辨識整合與真實匹配度計算
        window.isListening = false;

        window.toggleSttSimulation = function() {
            const btn = document.getElementById('btnSttAction');
            const wave = document.getElementById('liveWave');
            
            const SpeechRecognition = window.SpeechRecognition || window.webkitSpeechRecognition;
            if (!SpeechRecognition) {
                alert("目前的瀏覽器暫不支援語音辨識，請使用 Chrome 瀏覽器試試！");
                return;
            }

            if (!window.recognition) {
                window.recognition = new SpeechRecognition();
                window.recognition.lang = 'zh-HK';
                window.recognition.continuous = false;
                window.recognition.interimResults = true;
                window.recognition.maxAlternatives = 3;

                window.recognition.onstart = function() {
                    window.isListening = true;
                    btn.innerText = "聆聽中... 請大聲朗讀上圖字詞 🛑";
                    btn.style.backgroundColor = "#FFB7B2";
                    wave.style.visibility = "visible";
                };

                window.recognition.onresult = function(event) {
                    const transcript = event.results[0][0].transcript;
                    if (event.results[0].isFinal) {
                        const targetText = (window.currentActiveCourse && window.currentActiveCourse.targetText) ? window.currentActiveCourse.targetText : "";
                        const score = calculateScore(targetText, transcript);

                        wave.style.visibility = "hidden";
                        btn.style.backgroundColor = score >= 60 ? "#BFFCC6" : "#FFF275";
                        btn.innerHTML = `✅ 辨識結果：「${transcript}」<br>🏆 語音匹配度：${score}/100<br><span style='font-size:11px; font-weight:600;'>數據已紀錄至復康日誌</span>`;
                    } else {
                        btn.innerText = `聆聽中... 「${transcript}」`;
                    }
                };

                window.recognition.onerror = function(event) {
                    window.isListening = false;
                    wave.style.visibility = "hidden";
                    btn.style.backgroundColor = "#A0E7E5";
                    btn.innerText = "按此開始居家錄音複習 🎙️";
                    alert("未有接收到清晰聲音，請再試一次！");
                };

                window.recognition.onend = function() {
                    window.isListening = false;
                    wave.style.visibility = "hidden";
                };
            }

            if (!window.isListening) {
                try {
                    window.recognition.start();
                } catch(e) {
                    console.error("Recognition start error:", e);
                }
            } else {
                try {
                    window.recognition.stop();
                } catch(e) {
                    console.error("Recognition stop error:", e);
                }
            }
        };
